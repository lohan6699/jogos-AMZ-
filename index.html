<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guardião da Amazônia</title>
  <style>
    :root {
      --primary: #1d9e75;
      --primary-light: #5dcaa5;
      --dark: #04342c;
      --bg: #0d1f0e;
      --surface: #1a2b1b;
      --text: #e8f5e9;
      --accent: #ef9f27;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }

    #game-container { display: grid; grid-template-columns: 230px 800px; grid-template-rows: auto 1fr; gap: 16px; padding: 20px; max-width: 1060px; width: 100%; }

    header { grid-column: 1 / -1; background: linear-gradient(135deg, var(--dark), var(--primary)); padding: 14px 20px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 20px; letter-spacing: 1px; text-transform: uppercase; }
    header p { font-size: 13px; opacity: .75; }

    #hud { background: var(--surface); border: 1px solid rgba(93,202,165,.2); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .stat { background: rgba(0,0,0,.3); border-radius: 8px; padding: 10px 12px; }
    .stat-label { font-size: 11px; color: #9fa; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
    .stat-value { font-size: 20px; font-weight: 700; color: #fff; }
    .bar { width: 100%; height: 8px; background: rgba(255,255,255,.12); border-radius: 4px; margin-top: 6px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width .3s; }
    #fb { background: #1d9e75; }
    #fo { background: #378add; }

    #hint { margin-top: auto; font-size: 12px; color: rgba(255,255,255,.5); text-align: center; line-height: 1.6; padding: 8px; background: rgba(0,0,0,.2); border-radius: 8px; }

    #main-area { position: relative; display: flex; flex-direction: column; gap: 8px; }
    canvas { width: 100%; border-radius: 12px; border: 1px solid rgba(93,202,165,.2); display: block; cursor: crosshair; }

    /* Event overlay */
    #evt-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,.75); border-radius: 12px; align-items: center; justify-content: center; z-index: 10; }
    #evt-card { background: #1a2b1b; border: 1px solid var(--accent); border-radius: 12px; padding: 24px; max-width: 360px; width: 90%; box-shadow: 0 0 30px rgba(239,159,39,.2); }
    #evt-card h3 { color: var(--accent); font-size: 16px; margin-bottom: 10px; }
    #evt-card p { font-size: 13px; color: rgba(255,255,255,.7); line-height: 1.6; margin-bottom: 18px; }
    .choice-btn { width: 100%; padding: 10px 14px; margin-bottom: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.05); color: #fff; font-size: 13px; cursor: pointer; text-align: left; transition: all .2s; }
    .choice-btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }
    .choice-btn:last-child { margin-bottom: 0; }

    /* Toast */
    #toast { position: fixed; bottom: -80px; right: 20px; background: #fac775; color: #412402; padding: 12px 20px; border-radius: 10px; display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 13px; box-shadow: 0 4px 20px rgba(0,0,0,.3); transition: bottom .45s cubic-bezier(.175,.885,.32,1.275); z-index: 100; pointer-events: none; }
    #toast.show { bottom: 20px; }
  </style>
</head>
<body>

<div id="game-container">
  <header>
    <div>
      <h1>Guardião da Amazônia</h1>
      <p>Proteja a floresta contra desmatadores e incêndios</p>
    </div>
  </header>

  <div id="hud">
    <div class="stat">
      <div class="stat-label">Pontuação</div>
      <div id="sv" class="stat-value">0 pts</div>
    </div>
    <div class="stat">
      <div class="stat-label">Dias sobrevividos</div>
      <div id="dv" class="stat-value">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Biodiversidade</div>
      <div id="bv" class="stat-value">100%</div>
      <div class="bar"><div id="fb" class="bar-fill" style="width:100%"></div></div>
    </div>
    <div class="stat">
      <div class="stat-label">Oxigênio do planeta</div>
      <div id="ov" class="stat-value">100%</div>
      <div class="bar"><div id="fo" class="bar-fill" style="width:100%"></div></div>
    </div>
    <div id="hint">Clique nas chamas 🔥 e motosserras 🪚 para eliminá-las antes que destruam a floresta!</div>
  </div>

  <div id="main-area">
    <canvas id="gc" width="800" height="450"></canvas>
    <div id="evt-overlay">
      <div id="evt-card">
        <h3 id="et">Evento!</h3>
        <p id="ed">Descrição</p>
        <button class="choice-btn" id="ec1" onclick="choose(1)">Opção 1</button>
        <button class="choice-btn" id="ec2" onclick="choose(2)">Opção 2</button>
      </div>
    </div>
  </div>
</div>

<div id="toast">
  <span style="font-size:20px">🏆</span>
  <div>
    <div style="font-size:10px;text-transform:uppercase;opacity:.7">Conquista desbloqueada!</div>
    <div id="ach-name">Nome</div>
  </div>
</div>

<script>
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const EVENTS = [
  { title:"Madeireiros ilegais!", desc:"Caminhões entram na terra indígena. O que fazer?",
    c1:"Enviar fiscalização (+20 bio)", c2:"Acionar a mídia (+30 pts, -10 oxigênio)",
    e1:s=>{s.bio=Math.min(100,s.bio+20);s.score+=10}, e2:s=>{s.oxygen=Math.max(0,s.oxygen-10);s.score+=30} },
  { title:"Chuvas ácidas detectadas!", desc:"Poluição industrial afeta o dossel da floresta.",
    c1:"Plantar espécies resistentes (+15 bio)", c2:"Aumentar patrulha (+40 pts)",
    e1:s=>{s.bio=Math.min(100,s.bio+15)}, e2:s=>{s.score+=40;s.oxygen=Math.max(0,s.oxygen-8)} },
  { title:"Pesquisadores chegam!", desc:"Uma equipe científica quer estudar a fauna local.",
    c1:"Autorizar pesquisa (+10 bio, +10 oxigênio)", c2:"Recusar para proteger (+35 pts)",
    e1:s=>{s.bio=Math.min(100,s.bio+10);s.oxygen=Math.min(100,s.oxygen+10)}, e2:s=>{s.score+=35} },
  { title:"Garimpeiros ilegais!", desc:"Mercúrio contamina o rio Amazonas. Ação urgente?",
    c1:"Interditar a área (+25 bio, +10 pts)", c2:"Negociar saída pacífica (+45 pts, -5 bio)",
    e1:s=>{s.bio=Math.min(100,s.bio+25);s.score+=10}, e2:s=>{s.score+=45;s.bio=Math.max(0,s.bio-5)} },
];

const ACHIEVEMENTS = [
  {id:'a50',  pts:50,   name:'Primeiro passo'},
  {id:'a200', pts:200,  name:'Defensor da floresta'},
  {id:'a500', pts:500,  name:'Guardião supremo'},
  {id:'a1000',pts:1000, name:'Lenda da Amazônia'},
];

let S, raf, lastT=0, lastEvtScore=-999, achUnlocked={};

function initState() {
  S = { score:0, bio:100, oxygen:100, active:true, threats:[], trees:[], particles:[], day:0, spawnInterval:2200, lastSpawn:0, lastDay:0, evtPending:false };
  achUnlocked = {};
  lastEvtScore = -999;
  buildForest();
}

function buildForest() {
  S.trees = [];
  for (let i = 0; i < 28; i++) {
    S.trees.push({ x: 20 + Math.random()*(W-40), y: 65 + Math.random()*(H-100), r: 14 + Math.random()*12 });
  }
}

function spawnThreat() {
  const type = Math.random() < 0.5 ? 'fire' : 'saw';
  S.threats.push({ x: 40 + Math.random()*(W-80), y: 65 + Math.random()*(H-110), type, pulse: Math.random()*Math.PI*2, r: 22 });
}

function audioTone(freq, type, dur) {
  try {
    const a = new (window.AudioContext||window.webkitAudioContext)();
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(.08, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur);
  } catch(e) {}
}

function showToast(msg) {
  document.getElementById('ach-name').textContent = msg;
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

function checkAchievements() {
  ACHIEVEMENTS.forEach(a => {
    if (!achUnlocked[a.id] && S.score >= a.pts) {
      achUnlocked[a.id] = true;
      showToast(a.name);
      audioTone(880, 'sine', .4);
    }
  });
}

function triggerEvent() {
  if (S.evtPending) return;
  S.evtPending = true;
  const ev = EVENTS[Math.floor(Math.random() * EVENTS.length)];
  document.getElementById('et').textContent = ev.title;
  document.getElementById('ed').textContent = ev.desc;
  document.getElementById('ec1').textContent = ev.c1;
  document.getElementById('ec2').textContent = ev.c2;
  document.getElementById('evt-overlay').style.display = 'flex';
  window._curEvt = ev;
}

window.choose = function(opt) {
  if (!window._curEvt) return;
  (opt === 1 ? window._curEvt.e1 : window._curEvt.e2)(S);
  S.score = Math.max(0, S.score);
  document.getElementById('evt-overlay').style.display = 'none';
  S.evtPending = false;
  lastEvtScore = S.score;
  audioTone(opt === 1 ? 600 : 200, opt === 1 ? 'triangle' : 'sawtooth', .3);
}

function burst(x, y, col) {
  const ps = [];
  for (let i = 0; i < 8; i++) {
    const ang = Math.random()*Math.PI*2, spd = 1.5 + Math.random()*3;
    ps.push({ x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd, life: 1, col });
  }
  return ps;
}

function handleClick(e) {
  if (!S.active) return;
  const rect = canvas.getBoundingClientRect();
  const sx = W / rect.width, sy = H / rect.height;
  const cx = (e.clientX - rect.left)*sx, cy = (e.clientY - rect.top)*sy;
  let hit = false;
  S.threats = S.threats.filter(t => {
    if (Math.hypot(t.x - cx, t.y - cy) < t.r + 14) {
      hit = true;
      S.score += t.type === 'fire' ? 12 : 15;
      S.particles.push(...burst(t.x, t.y, t.type === 'fire' ? '#ef9f27' : '#5dcaa5'));
      return false;
    }
    return true;
  });
  if (hit) { audioTone(480, 'sine', .15); checkAchievements(); }
}

canvas.addEventListener('click', e => {
  if (!S.active) { restart(); return; }
  handleClick(e);
});

// --- DRAW FUNCTIONS ---

function drawRiver() {
  ctx.globalAlpha = .5;
  ctx.fillStyle = '#378add';
  ctx.beginPath();
  ctx.moveTo(0, 130);
  ctx.bezierCurveTo(200, 85, 400, 290, W, 185);
  ctx.lineTo(W, 240);
  ctx.bezierCurveTo(400, 345, 200, 150, 0, 188);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawTree(t) {
  ctx.fillStyle = '#5c4033';
  ctx.fillRect(t.x - 3, t.y, 6, t.r * .7);
  ctx.fillStyle = '#0f6e56';
  ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1d9e75';
  ctx.beginPath(); ctx.arc(t.x - t.r*.25, t.y - t.r*.2, t.r*.55, 0, Math.PI*2); ctx.fill();
}

function drawFire(t) {
  const s = t.r + Math.sin(t.pulse) * 5;
  ctx.globalAlpha = .85 + Math.sin(t.pulse) * .1;
  ctx.fillStyle = '#d85a30'; ctx.beginPath(); ctx.arc(t.x, t.y, s, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ef9f27'; ctx.beginPath(); ctx.arc(t.x, t.y, s*.6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#faeeda'; ctx.beginPath(); ctx.arc(t.x, t.y, s*.28, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawSaw(t) {
  const j = Math.sin(t.pulse * 5) * 2;
  ctx.fillStyle = '#888780'; ctx.fillRect(t.x - 18 + j, t.y - 7, 36, 14);
  ctx.fillStyle = '#444441'; ctx.fillRect(t.x + 10, t.y - 4, 14, 8);
  ctx.fillStyle = '#ef9f27';
  for (let i = 0; i < 4; i++) ctx.fillRect(t.x + 20 + i*4, t.y + (i%2 ? -6 : -9), 3, i%2 ? 6 : 9);
}

function drawParticles() {
  S.particles = S.particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vy += .1; p.life -= .06;
    if (p.life <= 0) return false;
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    return true;
  });
}

function drawTopBar() {
  ctx.fillStyle = 'rgba(4,52,44,.8)';
  ctx.beginPath(); ctx.roundRect(8, 8, W - 16, 36, 8); ctx.fill();
  ctx.font = '500 13px Segoe UI';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#9fe1cb'; ctx.textAlign = 'left';  ctx.fillText('Dia ' + S.day, 20, 26);
  ctx.fillStyle = '#fac775'; ctx.textAlign = 'center'; ctx.fillText('⚠ Clique nas ameaças para eliminá-las!', W/2, 26);
  ctx.fillStyle = '#9fe1cb'; ctx.textAlign = 'right';  ctx.fillText(S.score + ' pts', W - 20, 26);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function updateHUD() {
  const b = Math.max(0, Math.floor(S.bio)), o = Math.max(0, Math.floor(S.oxygen));
  document.getElementById('sv').textContent = S.score + ' pts';
  document.getElementById('dv').textContent = S.day;
  document.getElementById('bv').textContent = b + '%';
  document.getElementById('ov').textContent = o + '%';
  document.getElementById('fb').style.width = b + '%';
  document.getElementById('fo').style.width = o + '%';
}

// --- MAIN LOOP ---

function loop(ts) {
  if (!S.active) return;
  const dt = Math.min(ts - lastT, 60); lastT = ts;

  ctx.fillStyle = '#173404';
  ctx.fillRect(0, 0, W, H);
  drawRiver();
  S.trees.forEach(drawTree);

  if (!S.evtPending) {
    if (ts - S.lastSpawn > S.spawnInterval) {
      spawnThreat();
      S.lastSpawn = ts;
      S.spawnInterval = Math.max(700, S.spawnInterval - 18);
    }
    if (ts - S.lastDay > 5000) {
      S.lastDay = ts; S.day++; S.score += 5;
    }
    if (S.score - lastEvtScore >= 120 && S.score > 0) {
      triggerEvent();
    }
  }

  const dmg = S.evtPending ? 0 : .018;
  S.threats.forEach(t => {
    t.pulse += .12;
    if (t.type === 'fire') drawFire(t); else drawSaw(t);
    if (!S.evtPending) { S.bio -= dmg; S.oxygen -= dmg * .75; }
  });

  drawParticles();
  drawTopBar();
  updateHUD();

  S.bio = Math.max(0, S.bio);
  S.oxygen = Math.max(0, S.oxygen);

  if (S.bio <= 0 || S.oxygen <= 0) { endGame(); return; }
  raf = requestAnimationFrame(loop);
}

function endGame() {
  S.active = false;
  cancelAnimationFrame(raf);
  ctx.fillStyle = 'rgba(0,0,0,.85)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f09595';
  ctx.font = '700 36px Segoe UI';
  ctx.fillText('FIM DE JOGO', W/2, H/2 - 60);
  ctx.fillStyle = '#e8f5e9';
  ctx.font = '400 17px Segoe UI';
  ctx.fillText('Você defendeu a Amazônia por ' + S.day + ' dias', W/2, H/2 - 15);
  ctx.fillText('Pontuação final: ' + S.score + ' pts', W/2, H/2 + 20);
  ctx.fillStyle = '#5dcaa5';
  ctx.font = '400 14px Segoe UI';
  ctx.fillText('Clique em qualquer lugar para jogar novamente', W/2, H/2 + 70);
  canvas.style.cursor = 'pointer';
}

function restart() {
  canvas.style.cursor = 'crosshair';
  initState();
  lastT = performance.now();
  raf = requestAnimationFrame(loop);
}

// --- START ---
initState();
lastT = performance.now();
raf = requestAnimationFrame(loop);
</script>
</body>
</html>
