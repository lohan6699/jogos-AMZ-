};

let status = { vida: 100, fome: 100, sede: 100, energia: 100, sanidade: 100, temp: 36.5, veneno: 0, frio: 0 };
let inventario = { graveto: 3, folha: 2, resina: 1, pedra: 1, erva: 0, bambu: 0, carvao: 0, peixe: 0, agua_suja: 0, agua_limpa: 0 };
let jogoAtivo = false, dia = 1, periodo = 0; // 0:Manhã, 1:Tarde, 2:Noite
let lendasVistas = [], itensCraftados = 0, registrosDiario = [];
let lanternaLigada = false, lanternaBateria = 100;

// Sistema de Grid do Mundo Histórico
const TAM_MAPA = 40;
let mapa = [];
let playerPos = { x: 20, y: 20 };
let entidades = []; // Inimigos / Coletáveis / Lendas interativas

// Contextos Gráficos
let introCtx, tituloCtx, mundoCtx, miniCtx, modalCtx;
let introAnim, tituloAnim, mundoAnim, modalAnim;

// Estado do Controle (Gamepad API)
let gpIndex = null, gpAcaoSelIndex = 0, gpCraftSelIndex = 0, gpEmCraft = false;

// ============================================================================
// INTRO & CARREGAMENTO SINTÉTICO
// ============================================================================

window.addEventListener("DOMContentLoaded", () => {
  setupCanvases();
  iniciarIntro();
  setupInputs();
  window.addEventListener("gamepadconnected", (e) => {
    gpIndex = e.gamepad.index;
    document.getElementById("gp-indicator").style.display = "block";
    adicionarDiario("Controle conectado e mapeado com sucesso.");
  });
});

function setupCanvases() {
  const iC = document.getElementById("intro-canvas");
  const tC = document.getElementById("titulo-canvas");
  const mC = document.getElementById("canvas-mundo");
  const mnC = document.getElementById("canvas-mini");
  
  introCtx = iC.getContext("2d");
  tituloCtx = tC.getContext("2d");
  mundoCtx = mC.getContext("2d");
  miniCtx = mnC.getContext("2d");
  modalCtx = document.getElementById("modal-canvas").getContext("2d");

  const redimensionar = () => {
    iC.width = tC.width = window.innerWidth;
    iC.height = tC.height = window.innerHeight;
    mC.width = window.innerWidth;
    mC.height = window.innerHeight;
  };
  window.addEventListener("resize", redimensionar);
  redimensionar();
}

function iniciarIntro() {
  let progresso = 0;
  const barra = document.getElementById("intro-bar-fill");
  const statusTxt = document.getElementById("intro-status");
  const pressTxt = document.getElementById("intro-press");

  const frasesLoad = [
    "Sintonizando harmônicos da floresta...",
    "Materializando igarapés e restingas...",
    "Invocando os antigos espíritos...",
    "Preparando sua mente para o julgamento..."
  ];

  function loop() {
    introCtx.fillStyle = "rgba(0,4,0,0.08)";
    introCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    
    // Partículas orgânicas na intro
    for (let i = 0; i < 3; i++) {
      introCtx.fillStyle = Math.random() > 0.5 ? "#00ff7f" : "#e8c040";
      introCtx.globalAlpha = Math.random() * 0.4;
      introCtx.beginPath();
      introCtx.arc(Math.random() * window.innerWidth, Math.random() * window.innerHeight, Math.random() * 3, 0, Math.PI * 2);
      introCtx.fill();
    }
    introCtx.globalAlpha = 1.0;

    if (progresso < 100) {
      progresso += 0.6;
      barra.style.width = Math.min(progresso, 100) + "%";
      statusTxt.innerText = frasesLoad[Math.floor((progresso / 101) * frasesLoad.length)];
    } else {
      statusTxt.style.display = "none";
      pressTxt.style.display = "block";
    }
    introAnim = requestAnimationFrame(loop);
  }
  loop();

  const prosseguir = () => {
    if (progresso >= 100) {
      cancelAnimationFrame(introAnim);
      document.getElementById("tela-intro").style.display = "none";
      document.getElementById("tela-titulo").style.display = "flex";
      iniciarTelaTitulo();
      document.removeEventListener("keydown", prosseguir);
      document.removeEventListener("click", prosseguir);
    }
  };
  document.addEventListener("keydown", prosseguir);
  document.addEventListener("click", prosseguir);
}

// ============================================================================
// TELA DE TÍTULO (SISTEMA DE PARTÍCULAS RADIAIS)
// ============================================================================

function iniciarTelaTitulo() {
  let particulas = [];
  for(let i=0; i<60; i++) {
    particulas.push({
      x: window.innerWidth / 2, y: window.innerHeight / 2,
      a: Math.random() * Math.PI * 2, v: 0.5 + Math.random() * 1.5,
      r: 1 + Math.random() * 2, c: Math.random() > 0.4 ? "#236023" : "#c89010"
    });
  }

  function loop() {
    tituloCtx.fillStyle = "rgba(1, 6, 1, 0.15)";
    tituloCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    particulas.forEach(p => {
      p.x += Math.cos(p.a) * p.v;
      p.y += Math.sin(p.a) * p.v;
      if(p.x < 0 || p.x > window.innerWidth || p.y < 0 || p.y > window.innerHeight) {
        p.x = window.innerWidth / 2; p.y = window.innerHeight / 2;
        p.a = Math.random() * Math.PI * 2;
      }
      tituloCtx.fillStyle = p.c;
      tituloCtx.beginPath();
      tituloCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      tituloCtx.fill();
    });

    tituloAnim = requestAnimationFrame(loop);
  }
  loop();
}

// ============================================================================
// ENTRADA NO JOGO & GERAÇÃO PROCEDURAL DO MAPA
// ============================================================================

function iniciarJogo() {
  cancelAnimationFrame(tituloAnim);
  document.getElementById("tela-titulo").style.display = "none";
  document.getElementById("jogo").style.display = "block";
  document.getElementById("hud").style.display = "block";
  document.getElementById("mini-mapa").style.display = "block";
  document.getElementById("log-area").style.display = "block";
  document.getElementById("lanterna-hud").style.display = "block";
  document.getElementById("bussola").style.display = "block";

  gerarMundoProcedural();
  construirLendasHudh();
  jogoAtActive = true;
  jogoAtivo = true;
  
  adicionarDiario("Você acordou em um ponto remoto da bacia amazônica. A floresta observa.");
  atualizarHud();
  
  // Loops Principais
  setInterval(loopCicloTempo, 8000); // Avanço de hora rápido para gameplay dinâmico
  setInterval(loopMetabolismo, 2500);
  setInterval(loopControleEfeitos, 1000);
  
  requestAnimationFrame(loopMundo);
}

function gerarMundoProcedural() {
  // Geração de Matriz Base: 0=Vazio/Grama, 1=Árvores Densas, 2=Água/Igarapé, 3=Rocha
  for (let x = 0; x < TAM_MAPA; x++) {
    mapa[x] = [];
    for (let y = 0; y < TAM_MAPA; y++) {
      let r = Math.random();
      if ((x === 0 || x === TAM_MAPA-1 || y === 0 || y === TAM_MAPA-1)) {
        mapa[x][y] = 1; // Fronteira intransponível de mata fechada
      } else if (r < 0.22) {
        mapa[x][y] = 1; // Árvores
      } else if (r > 0.22 && r < 0.31) {
        mapa[x][y] = 2; // Igarapé
      } else if (r > 0.96) {
        mapa[x][y] = 3; // Rocha
      } else {
        mapa[x][y] = 0; // Solo limpo
      }
    }
  }
  
  // Garantir ponto seguro no spawn
  mapa[playerPos.x][playerPos.y] = 0;
  mapa[playerPos.x+1][playerPos.y] = 0;
  mapa[playerPos.x][playerPos.y+1] = 0;

  // Inserir Recursos Coletáveis Procedurais no mapa
  for (let i = 0; i < 45; i++) {
    let rx = Math.floor(Math.random() * (TAM_MAPA - 2)) + 1;
    let ry = Math.floor(Math.random() * (TAM_MAPA - 2)) + 1;
    if (mapa[rx][ry] === 0) {
      const tipos = ["graveto", "folha", "resina", "pedra", "erva", "bambu"];
      entidades.push({
        x: rx, y: ry,
        tipo: "recurso",
        item: tipos[Math.floor(Math.random() * tipos.length)]
      });
    }
  }

  // Inserir as 10 Lendas Ocultas no Mapa
  LENDAS_DATA.forEach(lenda => {
    let posValida = false, lx, ly;
    while (!posValida) {
      lx = Math.floor(Math.random() * (TAM_MAPA - 4)) + 2;
      ly = Math.floor(Math.random() * (TAM_MAPA - 4)) + 2;
      if (mapa[lx][ly] === 0 && Math.abs(lx - playerPos.x) > 4) posValida = true;
    }
    entidades.push({
      x: lx, y: ly,
      tipo: "lenda",
      data: lenda,
      descoberta: false
    });
  });

  // Inserir Inimigos Perigosos (Onça-Pintada, Jararaca)
  for (let i = 0; i < 6; i++) {
    let ix = Math.floor(Math.random() * (TAM_MAPA - 2)) + 1;
    let iy = Math.floor(Math.random() * (TAM_MAPA - 2)) + 1;
    if (mapa[ix][iy] === 0) {
      entidades.push({
        x: ix, y: iy,
        tipo: "inimigo",
        subtipo: Math.random() > 0.5 ? "Onça" : "Jararaca",
        vida: 40,
        furia: false
      });
    }
  }
}

function construirLendasHudh() {
  const container = document.getElementById("lendas-ico");
  container.innerHTML = "";
  LENDAS_DATA.forEach(l => {
    const w = document.createElement("div");
    w.className = "lenda-ico-wrap";
    w.id = `lenda-hud-${l.id}`;
    w.innerHTML = l.emoji;
    w.title = "Lenda Oculta";
    w.onclick = () => { if(lendasVistas.includes(l.id)) mostrarModalLenda(l); };
    container.appendChild(w);
  });
}

// ============================================================================
// ENGINE DE RENDERIZAÇÃO 2D (GRID + CAMADAS DE LUZ)
// ============================================================================

function loopMundo() {
  if (!jogoAtivo) return;

  processarControleGamepad();

  // Limpar Canvas Principal
  mundoCtx.fillStyle = "#010501";
  mundoCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  const tamTile = 64; // Escala visual expandida
  const centroX = window.innerWidth / 2;
  const centroY = window.innerHeight / 2;

  // Desenhar Camada do Terreno
  for (let x = 0; x < TAM_MAPA; x++) {
    for (let y = 0; y < TAM_MAPA; y++) {
      let renderX = centroX + (x - playerPos.x) * tamTile - tamTile/2;
      let renderY = centroY + (y - playerPos.y) * tamTile - tamTile/2;

      // Culling básico
      if (renderX < -tamTile || renderX > window.innerWidth + tamTile || renderY < -tamTile || renderY > window.innerHeight + tamTile) continue;

      switch(mapa[x][y]) {
        case 0: mundoCtx.fillStyle = "#091c0e"; break; // Solo
        case 1: mundoCtx.fillStyle = "#051207"; break; // Árvores
        case 2: mundoCtx.fillStyle = "#0c2b3a"; break; // Água
        case 3: mundoCtx.fillStyle = "#252b25"; break; // Rocha
      }
      mundoCtx.fillRect(renderX, renderY, tamTile - 1, tamTile - 1);

      // Elementos estéticos internos
      if(mapa[x][y] === 1) {
        mundoCtx.fillStyle = "#123a18";
        mundoCtx.beginPath();
        mundoCtx.arc(renderX + tamTile/2, renderY + tamTile/2, tamTile/3, 0, Math.PI*2);
        mundoCtx.fill();
      }
    }
  }

  // Desenhar Entidades Coletáveis, Inimigos e Lendas
  entidades.forEach(ent => {
    let rX = centroX + (ent.x - playerPos.x) * tamTile;
    let rY = centroY + (ent.y - playerPos.y) * tamTile;

    if (ent.tipo === "recurso") {
      mundoCtx.fillStyle = "#e8c040";
      mundoCtx.font = "14px monospace";
      mundoCtx.fillText("📦", rX - 7, rY + 5);
    } else if (ent.tipo === "lenda") {
      mundoCtx.fillStyle = ent.data.cor;
      mundoCtx.font = "20px serif";
      mundoCtx.fillText(ent.descoberta ? ent.data.emoji : "✨", rX - 10, rY + 8);
    } else if (ent.tipo === "inimigo") {
      mundoCtx.fillStyle = "#ff2800";
      mundoCtx.font = "18px serif";
      mundoCtx.fillText(ent.subtipo === "Onça" ? "🐆" : "🐍", rX - 9, rY + 6);
    }
  });

  // Desenhar Player (Explorador)
  mundoCtx.fillStyle = "#ffe868";
  mundoCtx.beginPath();
  mundoCtx.arc(centroX, centroY, 12, 0, Math.PI * 2);
  mundoCtx.fill();
  mundoCtx.strokeStyle = "#00ff7f";
  mundoCtx.lineWidth = 2;
  mundoCtx.stroke();

  // Camada Atmosférica Noturna e Lanterna Avançada
  processarIluminacaoAtmosferica(centroX, centroY);
  
  // Renderizar Mini-Mapa Real-Time
  renderizarMiniMapa();

  mundoAnim = requestAnimationFrame(loopMundo);
}

function processarIluminacaoAtmosferica(cX, cY) {
  if (periodo !== 2 && clima === "limpo") return;

  // Criar overlay de escuridão total
  let luzCanvas = document.createElement('canvas');
  luzCanvas.width = window.innerWidth;
  luzCanvas.height = window.innerHeight;
  let lCtx = luzCanvas.getContext('2d');

  let opacidadeBase = (periodo === 2) ? 0.94 : 0.45; // Noite ou Tempestade de dia
  lCtx.fillStyle = `rgba(1, 6, 2, ${opacidadeBase})`;
  lCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  if (lanternaLigada && lanternaBateria > 0) {
    // Corte radial da luz da lanterna usando blend mode
    lCtx.globalCompositeOperation = 'destination-out';
    let grad = lCtx.createRadialGradient(cX, cY, 10, cX, cY, 190);
    grad.addColorStop(0, 'rgba(0,0,0,1)');
    grad.addColorStop(0.6, 'rgba(0,0,0,0.5)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    lCtx.fillStyle = grad;
    lCtx.beginPath();
    lCtx.arc(cX, cY, 190, 0, Math.PI * 2);
    lCtx.fill();
    lCtx.globalCompositeOperation = 'source-over';
  }

  mundoCtx.drawImage(luzCanvas, 0, 0);
}

function renderizarMiniMapa() {
  miniCtx.fillStyle = "#010801";
  miniCtx.fillRect(0, 0, 140, 140);

  let tamPixel = 140 / TAM_MAPA;
  for (let x = 0; x < TAM_MAPA; x++) {
    for (let y = 0; y < TAM_MAPA; y++) {
      if (mapa[x][y] === 1) miniCtx.fillStyle = "#051a09";
      else if (mapa[x][y] === 2) miniCtx.fillStyle = "#0a2535";
      else miniCtx.fillStyle = "#0e2d16";
      miniCtx.fillRect(x * tamPixel, y * tamPixel, tamPixel, tamPixel);
    }
  }

  // Ponto do Player no radar
  miniCtx.fillStyle = "#fff";
  miniCtx.fillRect(playerPos.x * tamPixel, playerPos.y * tamPixel, tamPixel + 1, tamPixel + 1);
}

// ============================================================================
// SISTEMAS DE SIMULAÇÃO (METABOLISMO, CLIMA, COMPORTAMENTO)
// ============================================================================

function loopCicloTempo() {
  periodo++;
  if (periodo > 2) {
    periodo = 0;
    dia++;
  }

  const elHora = document.getElementById("hora-txt");
  let labelPeriodo = "";
  
  if (periodo === 0) { labelPeriodo = "Manhã"; status.temp = 36.5; }
  else if (periodo === 1) { labelPeriodo = "Tarde"; status.temp = 38.2; }
  else { labelPeriodo = "Noite 🌙"; status.temp = 22.0; adicionarDiario("A noite caiu. Os perigos e as lendas despertam com força total."); }

  elHora.innerText = `☀ Dia ${dia} — ${labelPeriodo}`;

  // Chance de alteração climática repentina
  if (Math.random() > 0.65) {
    clima = Math.random() > 0.5 ? "chuva" : "tempestade";
    document.getElementById("toast").innerText = `Clima Alterado: Mudar para ${clima.toUpperCase()}`;
    exibirToast();
  } else {
    clima = "limpo";
  }

  atualizarBussola();
}

function loopMetabolismo() {
  if (!jogoAtivo) return;

  // Consumo base orgânico
  status.fome = Math.max(0, status.fome - 2);
  status.sede = Math.max(0, status.sede - 3);
  status.energia = Math.max(0, status.energia - 1);

  if (periodo === 2) status.sanidade = Math.max(0, status.sanidade - 2); // Escuridão drena mente
  if (clima === "tempestade") { status.sanidade = Math.max(0, status.sanidade - 2); status.temp -= 2; }

  // Danos causados por privação extrema
  if (status.fome <= 0 || status.sede <= 0 || status.energia <= 0 || status.sanidade <= 0) {
    modificarVida(-5, "Inanição ou colapso psicológico severo na mata.");
  }

  // Comportamento da bateria da lanterna
  if (lanternaLigada) {
    lanternaBateria = Math.max(0, lanternaBateria - 4);
    document.getElementById("lant-fill").style.width = lanternaBateria + "%";
    if(lanternaBateria <= 0) { lanternaLigada = false; document.getElementById("lant-estado").innerText = "SEM ENERGIA"; }
  }

  // Movimentação Autônoma Básica dos Inimigos (IA de Patrulha)
  entidades.forEach(ent => {
    if (ent.tipo === "inimigo") {
      let dx = Math.floor(Math.random() * 3) - 1;
      let dy = Math.floor(Math.random() * 3) - 1;
      if (mapa[ent.x + dx]?.[ent.y + dy] === 0) {
        ent.x += dx;
        ent.y += dy;
      }
      
      // Proximidade agressiva com o jogador
      if (Math.abs(ent.x - playerPos.x) <= 1 && Math.abs(ent.y - playerPos.y) <= 1) {
        atacarJogador(ent);
      }
    }
  });

  atualizarHud();
}

function loopControleEfeitos() {
  if (!jogoAtivo) return;

  const container = document.getElementById("status-efeitos");
  container.innerHTML = "";

  if (status.veneno > 0) {
    status.veneno = Math.max(0, status.veneno - 1);
    modificarVida(-2, "Envenenamento por picada de Jararaca.");
    container.innerHTML += `<span class="efeit-chip" style="color:#00ff7f;border-color:#00ff7f">🧪 Veneno</span>`;
    document.getElementById("overlay-veneno").style.opacity = 0.5;
  } else {
    document.getElementById("overlay-veneno").style.opacity = 0;
  }

  if (status.temp < 25) {
    modificarVida(-1, "Hipotermia devido ao frio noturno e chuva intensificada.");
    container.innerHTML += `<span class="efeit-chip" style="color:#00bfff;border-color:#00bfff">🥶 Frio Extremo</span>`;
    document.getElementById("overlay-frio").style.opacity = 0.6;
  } else {
    document.getElementById("overlay-frio").style.opacity = 0;
  }

  if (status.sanidade < 30) {
    container.innerHTML += `<span class="efeit-chip" style="color:#d080ff;border-color:#d080ff">👁 Alucinações</span>`;
    document.getElementById("overlay-sanidade").style.opacity = 0.4;
  } else {
    document.getElementById("overlay-sanidade").style.opacity = 0;
  }
}

function atacarJogador(inimigo) {
  document.getElementById("aviso-inimigo").classList.add("ativo");
  setTimeout(() => document.getElementById("aviso-inimigo").classList.remove("ativo"), 1200);

  if (inventario.lanca > 0) {
    // Defesa automática consome a arma criada
    inventario.lanca--;
    inimigo.vida -= 25;
    adicionarLog(`Você usou sua Lança de Jagua para se defender da ${inimigo.subtipo}!`);
    if (inimigo.vida <= 0) {
      entidades = entidades.filter(e => e !== inimigo);
      adicionarLog(`Você abateu a ${inimigo.subtipo}.`);
      inventario.carvao += 1; // Recurso ganho
    }
  } else {
    modificarVida(-20, `Ataque direto de uma ${inimigo.subtipo}.`);
    if (inimigo.subtipo === "Jararaca") status.veneno = 12;
  }
  atualizarHud();
}

function modificarVida(qtd, causa) {
  status.vida = Math.max(0, Math.min(100, status.vida + qtd));
  if (qtd < 0) {
    const flash = document.getElementById("dmg-flash");
    flash.style.opacity = 0.7;
    setTimeout(() => flash.style.opacity = 0, 150);
  }
  if (status.vida <= 0) {
    finalizarJogo(causa);
  }
}

// ============================================================================
// INPUT MANAGEMENT & MOVIMENTO TRADICIONAL / GAMEPAD
// ============================================================================

function setupInputs() {
  document.addEventListener("keydown", (e) => {
    if (!jogoAtivo) return;
    
    let nx = playerPos.x;
    let ny = playerPos.y;

    switch(e.key.toLowerCase()) {
      case 'w': ny--; break;
      case 's': ny++; break;
      case 'a': nx--; break;
      case 'd': nx++; break;
      case 'f': alternarLanterna(); break;
      case 'c': alternarCrafting(); break;
      case 'j': alternarDiario(); break;
      case 'e':
      case 'enter':
        executarAcaoContexto();
        break;
      case 'q': navegarAcaoLinear(-1); break;
      case 'r': navegarAcaoLinear(1); break;
    }

    if (mapa[nx]?.[ny] === 0 || mapa[nx]?.[ny] === 2) {
      // Permitir andar na grama ou na água (água desacelera ou consome mais energia)
      if (mapa[nx][ny] === 2) status.energia = Math.max(0, status.energia - 1);
      playerPos.x = nx;
      playerPos.y = ny;
      atualizarAcoesDisponiveis();
      atualizarBussola();
    }
  });
}

function processarControleGamepad() {
  if (gpIndex === null) return;
  const gp = navigator.getGamepads()[gpIndex];
  if (!gp) return;

  // Deadzone para sticks analógicos
  const limite = 0.4;
  let moveX = 0, moveY = 0;

  if (gp.axes[0] < -limite) moveX = -1;
  if (gp.axes[0] > limite) moveX = 1;
  if (gp.axes[1] < -limite) moveY = -1;
  if (gp.axes[1] > limite) moveY = 1;

  // Implementar throttle no movimento por eixos para evitar teletransporte frenético
  if (moveX !== 0 || moveY !== 0) {
    if (!this.lastGpMove || Date.now() - this.lastGpMove > 180) {
      let nx = playerPos.x + moveX;
      let ny = playerPos.y + moveY;
      if (mapa[nx]?.[ny] === 0) { playerPos.x = nx; playerPos.y = ny; atualizarAcoesDisponiveis(); }
      this.lastGpMove = Date.now();
    }
  }

  // Mapeamento de botões padrão (Xbox/PlayStation)
  // Botão A (0) - Ação Principal
  if (gp.buttons[0].pressed) {
    if(!this.b0P) {
      if(gpEmCraft) fabricarItemGp();
      else executarAcaoContexto();
      this.b0P = true;
    }
  } else { this.b0P = false; }

  // Botão B (1) - Fechar Telas Modais
  if (gp.buttons[1].pressed) {
    fecharCraft(); fecharDiario(); fecharModalLenda();
  }

  // Botão X (2) - Lanterna
  if (gp.buttons[2].pressed) {
    if(!this.b2P) { alternarLanterna(); this.b2P = true; }
  } else { this.b2P = false; }

  // Botão Y (3) - Abrir Menu de Fabricação
  if (gp.buttons[3].pressed) {
    if(!this.b3P) { alternarCrafting(); this.b3P = true; }
  } else { this.b3P = false; }

  // Bumpers LB (4) e RB (5) para alternar foco de botões contextuais
  if (gp.buttons[4].pressed) {
    if(!this.b4P) { if(gpEmCraft) navegarCraftGp(-1); else navegarAcaoLinear(-1); this.b4P = true; }
  } else { this.b4P = false; }
  
  if (gp.buttons[5].pressed) {
    if(!this.b5P) { if(gpEmCraft) navegarCraftGp(1); else navegarAcaoLinear(1); this.b5P = true; }
  } else { this.b5P = false; }
}

// ============================================================================
// CONTEXTUAL ACTIONS MECHANICS
// ============================================================================

let acoesContextuais = [];

function atualizarAcoesDisponiveis() {
  acoesContextuais = [];
  const wrap = document.getElementById("acoes-wrap");
  wrap.innerHTML = "";

  // Verificar se há recursos no tile atual
  let recs = entidades.filter(e => e.tipo === "recurso" && e.x === playerPos.x && e.y === playerPos.y);
  recs.forEach(r => {
    acoesContextuais.push({ label: `Coletar ${r.item.toUpperCase()}`, tipo: "coleta", alvo: r });
  });

  // Verificar se há lenda no tile atual ou adjacente
  let lendas = entidades.filter(e => e.tipo === "lenda" && Math.abs(e.x - playerPos.x) <= 1 && Math.abs(e.y - playerPos.y) <= 1);
  lendas.forEach(l => {
    if(!l.descoberta) acoesContextuais.push({ label: `Investigar Presença Mística`, tipo: "lenda", alvo: l });
    else acoesContextuais.push({ label: `Comungar com ${l.data.nome}`, tipo: "comungar", alvo: l });
  });

  // Ações básicas baseadas no tipo de solo
  if (mapa[playerPos.x][playerPos.y] === 2) {
    acoesContextuais.push({ label: "Coletar Água de Igarapé", tipo: "agua", alvo: null });
  }

  // Adicionar botões na interface
  acoesContextuais.forEach((ac, index) => {
    const btn = document.createElement("button");
    btn.className = "btn-ac";
    if (index === gpAcaoSelIndex) btn.classList.add("sel");
    if (ac.tipo === "lenda") btn.classList.add("dest");
    btn.innerText = ac.label;
    btn.onclick = () => { gpAcaoSelIndex = index; executarAcaoContexto(); };
    wrap.appendChild(btn);
  });
}

function navegarAcaoLinear(dir) {
  if (acoesContextuais.length === 0) return;
  gpAcaoSelIndex = (gpAcaoSelIndex + dir + acoesContextuais.length) % acoesContextuais.length;
  atualizarAcoesDisponiveis();
}

function executarAcaoContexto() {
  if (acoesContextuais.length === 0 || !acoesContextuais[gpAcaoSelIndex]) return;
  const ac = acoesContextuais[gpAcaoSelIndex];

  if (ac.tipo === "coleta") {
    inventario[ac.alvo.item]++;
    entidades = entidades.filter(e => e !== ac.alvo);
    adicionarLog(`Você coletou: [${ac.alvo.item.toUpperCase()}].`);
  } 
  else if (ac.tipo === "lenda") {
    ac.alvo.descoberta = true;
    if (!lendasVistas.includes(ac.alvo.data.id)) {
      lendasVistas.push(ac.alvo.data.id);
      document.getElementById(`lenda-hud-${ac.alvo.data.id}`).classList.add("vista");
      mostrarModalLenda(ac.alvo.data);
      adicionarDiario(`Encontro místico documentado: A lenda do ${ac.alvo.data.nome}.`);
      verificarConquistas();
    }
  }
  else if (ac.tipo === "agua") {
    inventario.agua_suja++;
    adicionarLog("Você encheu um recipiente com água turva do igarapé.");
  }
  else if (ac.tipo === "comungar") {
    status.sanidade = Math.min(100, status.sanidade + 15);
    adicionarLog(`Você meditou sob a influência benfeitora de ${ac.alvo.data.nome}.`);
  }

  gpAcaoSelIndex = 0;
  atualizarAcoesDisponiveis();
  atualizarHud();
}

// ============================================================================
// CRAFTING SYSTEM ENGINE
// ============================================================================

function alternarCrafting() {
  const p = document.getElementById("painel-craft");
  p.classList.toggle("aberto");
  gpEmCraft = p.classList.contains("aberto");
  if (gpEmCraft) {
    document.getElementById("gp-craft-sel").style.display = "block";
    renderizarListaCraft();
  } else {
    document.getElementById("gp-craft-sel").style.display = "none";
  }
}

function fecharCraft() {
  document.getElementById("painel-craft").classList.remove("aberto");
  document.getElementById("gp-craft-sel").style.display = "none";
  gpEmCraft = false;
}

function renderizarListaCraft() {
  const grid = document.getElementById("craft-grid");
  grid.innerHTML = "";

  CRAFT_RECIPES.forEach((rec, idx) => {
    const itemBox = document.createElement("div");
    itemBox.className = "craft-item";
    if (idx === gpCraftSelIndex) itemBox.classList.add("gp-sel");

    // Validar requerimentos de insumos
    let possuiTudo = true;
    let txtReq = "";
    for (let component in rec.req) {
      let qtdDisponivel = inventario[component] || 0;
      txtReq += `${component.toUpperCase()}: ${qtdDisponivel}/${rec.req[component]} | `;
      if (qtdDisponivel < rec.req[component]) possuiTudo = false;
    }

    if (!possuiTudo) itemBox.classList.add("bloq");

    itemBox.innerHTML = `
      <div class="craft-item-nome">${rec.nome}</div>
      <div class="craft-item-req">${txtReq.slice(0, -3)}</div>
      <div class="craft-item-desc">${rec.desc}</div>
    `;

    itemBox.onclick = () => {
      if (possuiTudo) { gpCraftSelIndex = idx; realizarCraftItem(rec); }
    };

    grid.appendChild(itemBox);
  });
}

function navegarCraftGp(dir) {
  gpCraftSelIndex = (gpCraftSelIndex + dir + CRAFT_RECIPES.length) % CRAFT_RECIPES.length;
  renderizarListaCraft();
}

function fabricarItemGp() {
  const rec = CRAFT_RECIPES[gpCraftSelIndex];
  let possuiTudo = true;
  for (let c in rec.req) { if ((inventario[c] || 0) < rec.req[c]) possuiTudo = false; }
  if (possuiTudo) realizarCraftItem(rec);
}

function realizarCraftItem(rec) {
  // Deduzir materiais
  for (let component in rec.req) {
    inventario[component] -= rec.req[component];
  }

  // Incrementar item pronto
  if (rec.id === "tocha") lanternaBateria = 100; // Recarrega/substitui fonte de luz
  else if (rec.id === "filtro" && inventario.agua_suja > 0) { inventario.agua_suja--; inventario.agua_limpa++; }
  else if (rec.id === "medicamento") { status.vida = Math.min(100, status.vida + 30); status.veneno = 0; }
  else {
    inventario[rec.id] = (inventario[rec.id] || 0) + 1;
  }

  itensCraftados++;
  adicionarLog(`Item fabricado com sucesso: ${rec.nome}`);
  verificarConquistas();
  renderizarListaCraft();
  atualizarHud();
}

// ============================================================================
// DIÁRIO DE BORDO & NOTIFICAÇÕES (SISTEMA HISTÓRICO)
// ============================================================================

function alternarDiario() {
  const p = document.getElementById("painel-diario");
  p.classList.toggle("aberto");
  if(p.classList.contains("aberto")) {
    const corpo = document.getElementById("diario-corpo");
    corpo.innerHTML = "";
    registrosDiario.forEach(r => {
      corpo.innerHTML += `
        <div class="entrada-diario">
          <span class="entrada-ts">${r.timestamp}</span>
          ${r.txt}
        </div>
      `;
    });
  }
}

function fecharDiario() { document.getElementById("painel-diario").classList.remove("aberto"); }

function adicionarDiario(texto) {
  const agora = new Date();
  const ts = `${agora.getHours().toString().padStart(2,'0')}:${agora.getMinutes().toString().padStart(2,'0')}:${agora.getSeconds().toString().padStart(2,'0')}`;
  registrosDiario.unshift({ timestamp: `Registro Ciclo d${dia} - ${ts}`, txt: texto });
}

function verificarConquistas() {
  if (itensCraftados >= 1 && !CONQUISTAS_DATA.primeiroPasso.dest) dispararConquista("primeiroPasso");
  if (itensCraftados >= 3 && !CONQUISTAS_DATA.artesao.dest) dispararConquista("artesao");
  if (lendasVistas.length >= 5 && !CONQUISTAS_DATA.mitologia.dest) dispararConquista("mitologia");
  if (lendasVistas.length === 10 && !CONQUISTAS_DATA.imortal.dest) dispararConquista("imortal");
}

function dispararConquista(id) {
  CONQUISTAS_DATA[id].dest = true;
  const notif = document.getElementById("conquista-notif");
  document.getElementById("conq-nome").innerText = CONQUISTAS_DATA[id].nome;
  notif.classList.add("vis");
  setTimeout(() => notif.classList.remove("vis"), 4000);
}

// ============================================================================
// MODAL DE LENDA EXPANDIDO COM EFEITOS DE FUNDO RENDERIZADOS
// ============================================================================

function mostrarModalLenda(data) {
  cancelAnimationFrame(modalAnim);
  document.getElementById("modal-lenda").classList.add("aberto");

  document.getElementById("m-nome").innerText = data.nome.toUpperCase();
  document.getElementById("m-tipo").innerText = data.tipo;
  document.getElementById("m-texto").innerText = data.desc;
  document.getElementById("m-dica-txt").innerText = data.dica;
  document.getElementById("m-efeito").innerText = `Efeito Concedido: ${data.efeito}`;
  document.getElementById("m-emoji").innerText = data.emoji;

  // Customização de Cores Dinâmicas no Frame do Modal
  const frameOrbe = document.getElementById("m-orbe");
  frameOrbe.style.color = data.cor;
  document.getElementById("m-nome").style.color = data.cor;
  document.getElementById("m-top-bar").style.background = data.cor;
  document.getElementById("m-dica").style.borderColor = data.cor;
  document.getElementById("m-efeito").style.color = data.cor;
  document.getElementById("m-efeito").style.borderColor = data.cor;
  document.getElementById("m-btn-ok").style.borderColor = data.cor;
  document.getElementById("m-btn-ok").style.color = data.cor;

  // Efeito de Aura no Canvas Interno do Modal
  const c = document.getElementById("modal-canvas");
  const ctx = modalCtx;
  c.width = 680; c.height = 500;
  let angulo = 0;

  function animarModal() {
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.strokeStyle = data.cor;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.15;

    // Linhas abstratas orbitando o centro do modal
    ctx.beginPath();
    for (let i = 0; i < c.width; i += 15) {
      let y = c.height / 2 + Math.sin(i * 0.02 + angulo) * 40;
      ctx.lineTo(i, y);
    }
    ctx.stroke();
    angulo += 0.04;

    modalAnim = requestAnimationFrame(animarModal);
  }
  animarModal();
}

function fecharModalLenda() {
  cancelAnimationFrame(modalAnim);
  document.getElementById("modal-lenda").classList.remove("aberto");
}

// ============================================================================
// UTILITIES, INTERFACE UPDATES & ENDGAME
// ============================================================================

function alternarLanterna() {
  if (lanternaBateria <= 0) return;
  lanternaLigada = !lanternaLigada;
  document.getElementById("lant-estado").innerText = lanternaLigada ? "LIGADA" : "DESLIGADA";
  document.getElementById("lant-estado").style.color = lanternaLigada ? "#00ff7f" : "#555";
}

function atualizarHud() {
  // Ajuste de Barras SVGs/CSS
  document.getElementById("b-vida").style.width = status.vida + "%";
  document.getElementById("n-vida").innerText = status.vida;
  if(status.vida < 30) document.getElementById("row-vida").classList.add("stat-crit");
  else document.getElementById("row-vida").classList.remove("stat-crit");

  document.getElementById("b-fome").style.width = status.fome + "%";
  document.getElementById("n-fome").innerText = status.fome;
  
  document.getElementById("b-sede").style.width = status.sede + "%";
  document.getElementById("n-sede").innerText = status.sede;

  document.getElementById("b-ener").style.width = status.energia + "%";
  document.getElementById("n-ener").innerText = status.energia;

  document.getElementById("b-san").style.width = status.sanidade + "%";
  document.getElementById("n-san").innerText = status.sanidade;

  document.getElementById("b-temp").style.width = (status.temp * 2) + "%";
  document.getElementById("n-temp").innerText = Math.round(status.temp) + "°C";

  // Painel Superior de Recursos Atuais (Inventário Lateral Scannable)
  const invCont = document.getElementById("inv-wrap");
  invCont.innerHTML = "";
  for (let item in inventario) {
    if (inventario[item] > 0) {
      const chip = document.createElement("span");
      chip.className = "inv-chip";
      chip.innerText = `${item.toUpperCase()} ×${inventario[item]}`;
      // Consumo rápido de alimentos via click no inventário
      if (item === "agua_limpa") {
        chip.onclick = () => { inventario.agua_limpa--; status.sede = Math.min(100, status.sede + 40); atualizarHud(); };
      }
      invCont.appendChild(chip);
    }
  }
}

function atualizarBussola() {
  const dirs = ["↑ Norte", "→ Leste", "↓ Sul", "← Oeste"];
  // Bússola muda em tempo real baseado no quadrante do mapa
  let dIdx = 0;
  if (playerPos.x > TAM_MAPA / 2) dIdx = 1;
  if (playerPos.y > TAM_MAPA / 2) dIdx = 2;
  document.getElementById("buss-txt").innerHTML = `<span class="buss-dir">${dirs[dIdx]}</span> | Posição: ${playerPos.x}, ${playerPos.y}`;
}

function adicionarLog(msg) {
  document.getElementById("msg-atual").innerText = msg;
}

function exibirToast() {
  const t = document.getElementById("toast");
  t.classList.add("vis");
  setTimeout(() => t.classList.remove("vis"), 3000);
}

function finalizarJogo(causaMorte) {
  jogoAtivo = false;
  cancelAnimationFrame(mundoAnim);
  document.getElementById("jogo").style.display = "none";
  document.getElementById("hud").style.display = "none";
  
  const telaFim = document.getElementById("tela-fim");
  telaFim.classList.add("aberto");
  
  document.getElementById("fim-causa").innerText = causaMorte;
  document.getElementById("f-dias").innerText = dia;
  document.getElementById("f-lendas").innerText = `${lendasVistas.length}/10`;
  document.getElementById("f-crafted").innerText = itensCraftados;

  const cFim = document.getElementById("fim-conquistas");
  cFim.innerHTML = "";
  for(let c in CONQUISTAS_DATA) {
    if(CONQUISTAS_DATA[c].dest) {
      cFim.innerHTML += `<span class="fim-c-chip">🏆 ${CONQUISTAS_DATA[c].nome}</span>`;
    }
  }
}
