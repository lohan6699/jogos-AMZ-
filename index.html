<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guerreiro da Amazônia: Corrida Pela Floresta</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            background: #1a3c1e;
            border: 4px solid #2e7d32;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #4da6ff, #85e0ff);
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        #score-box { color: #ffd700; }
        #highscore-box { color: #a5d6a7; }
        
        #screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        h1 {
            color: #4caf50;
            margin-bottom: 10px;
            font-size: 36px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
            text-align: center;
        }
        p {
            margin-bottom: 20px;
            font-size: 16px;
            color: #ccc;
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: #2e7d32;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4);
            pointer-events: auto;
        }
        button:hover {
            background: #388e3c;
            transform: scale(1.05);
        }
        #controls-hint {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }
        /* Botão para Mobile */
        #mobile-jump-btn {
            display: none;
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 70px;
            height: 70px;
            background: rgba(255,255,255,0.3);
            border: 2px solid #fff;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }
        @media (max-width: 820px) {
            #game-container {
                width: 100%;
                height: 300px;
            }
            #mobile-jump-btn { display: flex; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div id="ui-layer">
            <div class="stats">
                <div id="score-box">Sementes: <span id="score">0</span></div>
                <div id="highscore-box">Recorde: <span id="highscore">0</span></div>
            </div>
            
            <div id="mobile-jump-btn">PULAR</div>
        </div>

        <div id="screen-overlay">
            <h1 id="screen-title">Defensor da Amazônia</h1>
            <p id="screen-desc">Ajude o curupira a coletar sementes sagradas e desviar dos troncos cortados pelos lenhadores!</p>
            <button id="start-btn">JOGAR</button>
            <div id="controls-hint">Pressione ESPAÇO, SETA PARA CIMA ou Toque na tela para pular</div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const screenOverlay = document.getElementById('screen-overlay');
    const screenTitle = document.getElementById('screen-title');
    const screenDesc = document.getElementById('screen-desc');
    const startBtn = document.getElementById('start-btn');
    const scoreDisplay = document.getElementById('score');
    const highscoreDisplay = document.getElementById('highscore');
    const mobileJumpBtn = document.getElementById('mobile-jump-btn');

    // Configurações do Jogo
    let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
    let score = 0;
    let highscore = localStorage.getItem('amazon_highscore') || 0;
    highscoreDisplay.innerText = highscore;

    let gameSpeed = 5;
    const gravity = 0.6;
    
    // Entidades do Jogo
    let player = {
        x: 80,
        y: 280,
        width: 40,
        height: 60,
        vy: 0,
        isGrounded: false,
        jumpForce: -13,
        color: '#ff5722', // Cabelo vermelho do Curupira
        draw() {
            // Corpo/Roupa de folhas
            ctx.fillStyle = '#4caf50';
            ctx.fillRect(this.x, this.y + 20, this.width, this.height - 20);
            // Cabeça
            ctx.fillStyle = '#ffb74d';
            ctx.fillRect(this.x + 5, this.y, this.width - 10, 20);
            // Cabelo de Fogo (Curupira)
            ctx.fillStyle = '#ff3d00';
            ctx.fillRect(this.x + 2, this.y - 8, this.width - 4, 10);
            // Pés virados para trás (detalhe folclórico)
            ctx.fillStyle = '#d7ccc8';
            ctx.fillRect(this.x - 5, this.y + this.height - 8, 12, 8);
        },
        jump() {
            if (this.isGrounded) {
                this.vy = this.jumpForce;
                this.isGrounded = false;
            }
        },
        update() {
            this.vy += gravity;
            this.y += this.vy;
            
            // Colisão com o chão fixo (altura do chão é 340)
            if (this.y + this.height >= 340) {
                this.y = 340 - this.height;
                this.vy = 0;
                this.isGrounded = true;
            }
        }
    };

    let obstacles = [];
    let items = [];
    let particles = [];
    let clouds = [
        {x: 100, y: 50, size: 40, speed: 0.5},
        {x: 450, y: 80, size: 60, speed: 0.3},
        {x: 700, y: 30, size: 35, speed: 0.6}
    ];

    // Classes para geração de objetos modernos e limpos
    class Obstacle {
        constructor() {
            this.width = 30 + Math.random() * 20;
            this.height = 40 + Math.random() * 30;
            this.x = canvas.width + this.width;
            this.y = 340 - this.height;
            this.color = '#795548'; // Tronco cortado
        }
        update() {
            this.x -= gameSpeed;
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.width, this.height);
            // Detalhe de linhas de motosserra/corte
            ctx.fillStyle = '#5d4037';
            ctx.fillRect(this.x + 2, this.y + 5, this.width - 4, 5);
        }
    }

    class Item {
        constructor() {
            this.size = 15;
            this.x = canvas.width + 50;
            this.y = 180 + Math.random() * 100;
            this.color = '#ffd700'; // Semente dourada brilhante
            this.angle = 0;
        }
        update() {
            this.x -= gameSpeed;
            this.angle += 0.1; // Efeito de rotação moderno
        }
        draw() {
            ctx.save();
            ctx.translate(this.x + this.size/2, this.y + this.size/2);
            ctx.rotate(this.angle);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(0, 0, this.size/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 5 + 2;
            this.vx = (Math.random() - 0.5) * 6;
            this.vy = (Math.random() - 0.5) * 6;
            this.alpha = 1;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.03;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.restore();
        }
    }

    // Spawners controlados por tempo/distância
    let obstacleTimer = 0;
    let itemTimer = 0;

    function resetGame() {
        score = 0;
        gameSpeed = 6;
        obstacles = [];
        items = [];
        particles = [];
        player.y = 280;
        player.vy = 0;
        scoreDisplay.innerText = score;
    }

    function startGame() {
        resetGame();
        gameState = 'PLAYING';
        screenOverlay.style.display = 'none';
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        if (score > highscore) {
            highscore = score;
            localStorage.setItem('amazon_highscore', highscore);
            highscoreDisplay.innerText = highscore;
        }
        screenTitle.innerText = "Fim de Jogo!";
        screenDesc.innerText = `Você salvou ${score} sementes da floresta moderna. Tente quebrar seu recorde!`;
        startBtn.innerText = "JOGAR DE NOVO";
        screenOverlay.style.display = 'flex';
    }

    // Loop Principal do Jogo (Engine de Renderização e Física)
    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 1. DESENHAR CENÁRIO (Céu e Nuvens)
        ctx.fillStyle = 'linear-gradient(to bottom, #4da6ff, #85e0ff)';
        clouds.forEach(cloud => {
            cloud.x -= cloud.speed;
            if (cloud.x + cloud.size < 0) cloud.x = canvas.width + 50;
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.beginPath();
            ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
            ctx.arc(cloud.x + cloud.size*0.6, cloud.y - cloud.size*0.2, cloud.size*0.8, 0, Math.PI * 2);
            ctx.fill();
        });

        // Árvores de fundo (Parallax simples)
        ctx.fillStyle = '#1b5e20';
        for(let i = 0; i < canvas.width; i += 120) {
            ctx.beginPath();
            ctx.moveTo(i - 40, 340);
            ctx.lineTo(i + 20, 150);
            ctx.lineTo(i + 80, 340);
            ctx.fill();
        }

        // Chão da Floresta Amazônica
        ctx.fillStyle = '#2e7d32';
        ctx.fillRect(0, 340, canvas.width, 60);
        ctx.fillStyle = '#1b5e20';
        ctx.fillRect(0, 340, canvas.width, 8);

        if (gameState === 'PLAYING') {
            // Aumenta a velocidade do jogo gradualmente de forma imperceptível
            gameSpeed += 0.001;

            // Atualiza Jogador
            player.update();
            
            // Gerar Obstáculos de tempos em tempos
            obstacleTimer++;
            if (obstacleTimer > Math.random() * 40 + 70) {
                obstacles.push(new Obstacle());
                obstacleTimer = 0;
            }

            // Gerar Itens (Sementes)
            itemTimer++;
            if (itemTimer > Math.random() * 50 + 50) {
                items.push(new Item());
                itemTimer = 0;
            }
        }

        // Renderizar e Atualizar Obstáculos
        for (let i = obstacles.length - 1; i >= 0; i--) {
            if (gameState === 'PLAYING') obstacles[i].update();
            obstacles[i].draw();

            // Detecção de Colisão com o Jogador (AABB box)
            if (
                player.x < obstacles[i].x + obstacles[i].width &&
                player.x + player.width > obstacles[i].x &&
                player.y < obstacles[i].y + obstacles[i].height &&
                player.y + player.height > obstacles[i].y
            ) {
                gameOver();
            }

            // Limpar do array se sair da tela
            if (obstacles[i].x + obstacles[i].width < 0) {
                obstacles.splice(i, 1);
            }
        }

        // Renderizar e Atualizar Itens (Sementes)
        for (let i = items.length - 1; i >= 0; i--) {
            if (gameState === 'PLAYING') items[i].update();
            items[i].draw();

            // Coleta de Item
            if (
                player.x < items[i].x + items[i].size &&
                player.x + player.width > items[i].x &&
                player.y < items[i].y + items[i].size &&
                player.y + player.height > items[i].y
            ) {
                score += 10;
                scoreDisplay.innerText = score;
                
                // Criação do efeito de partículas moderno
                for(let p=0; p<8; p++) {
                    particles.push(new Particle(items[i].x, items[i].y));
                }
                items.splice(i, 1);
                continue;
            }

            if (items[i].x + items[i].size < 0) items.splice(i, 1);
        }

        // Processar Partículas
        for(let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();
            if(particles[i].alpha <= 0) particles.splice(i, 1);
        }

        // Desenhar Personagem principal por cima de tudo
        player.draw();

        requestAnimationFrame(gameLoop);
    }

    // Controles (Input modernizado para PC e Mobile)
    window.addEventListener('keydown', (e) => {
        if ((e.code === 'Space' || e.code === 'ArrowUp')) {
            if (gameState === 'PLAYING') {
                player.jump();
            } else if (gameState === 'MENU' || gameState === 'GAMEOVER') {
                startGame();
            }
        }
    });

    // Toque para telas Mobile e Cliques de Botão
    startBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // Evita dar pulo duplo ao clicar no botão
        startGame();
    });
    
    mobileJumpBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (gameState === 'PLAYING') player.jump();
    });

    // Inicialização da Engine
    gameLoop();
</script>
</body>
</html>
